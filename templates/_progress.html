<div id="results" hx-get="/scan/result?brand={{ brand|urlencode }}{% if replay %}&replay=1{% endif %}" hx-trigger="load" hx-swap="outerHTML">
  <p class="lg-tagline" role="status">
    <span
      id="scan-stage-text"
      hx-get="/scan/stage?brand={{ brand|urlencode }}"
      hx-trigger="every 700ms"
      hx-swap="innerHTML"
    >{{ generated }} look-alikes generated &middot; checking availability&hellip;</span>
    <span class="animate-pulse" style="color:var(--lg-faint);" aria-hidden="true">&middot;&middot;&middot;</span>
  </p>
  <div class="mt-2 flex flex-wrap gap-1.5" aria-label="sources for the statistics above">
    <a class="lg-chip lg-chip-muted" href="https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf" target="_blank" rel="noopener">FBI IC3 2024</a>
    <a class="lg-chip lg-chip-muted" href="https://www.rfc-editor.org/rfc/rfc7489.html" target="_blank" rel="noopener">RFC 7489</a>
    <a class="lg-chip lg-chip-muted" href="https://www.ndss-symposium.org/ndss2015/ndss-2015-programme/seven-months-worth-mistakes-longitudinal-study-typosquatting-abuse/" target="_blank" rel="noopener">NDSS 2015</a>
  </div>
</div>
