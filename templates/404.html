{% extends "base.html" %}
{% block title %}Not found — typo.watch{% endblock %}
{% block body %}
<main>
  <p class="lg-tagline">No cached scan for that brand yet.</p>
  <form hx-post="/scan" hx-target="#results" hx-swap="innerHTML" class="lg-search">
    <label class="lg-search-field">
      <input type="text" name="brand" placeholder="your-brand.com" autofocus required>
    </label>
    <button type="submit" class="lg-pill-btn lg-scan-btn">Scan</button>
  </form>
  <div id="results" class="mt-8"></div>
</main>
{% endblock %}
