[project]
name = "squatwatch"
version = "0.1.0"
description = "Type your brand, see who already owns your typos, take the dangerous ones back in one click."
requires-python = ">=3.12"

[project.scripts]
squatwatch = "squatwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squatwatch"]
