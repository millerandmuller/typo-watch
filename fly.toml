app = 'typo-watch'
primary_region = 'fra'

[build]

[env]
  PORT = '8000'

[[mounts]]
  source = 'squatwatch_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
